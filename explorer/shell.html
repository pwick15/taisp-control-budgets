<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control dataset explorer</title>
<meta name="description" content="Three interactive lenses over every in-scope suspicion-score run from the AI-control budgets study: a reasoning-length sample atlas with pinnable judgements, effort trajectories, and an operating-point flight deck.">
<style>/*CSS*/</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <button class="btn theme-toggle" id="theme-btn" type="button" aria-label="Toggle theme"></button>
    <p class="kicker">AI-control budgets study</p>
    <h1>The control dataset, three ways</h1>
    <p class="lede">Each monitor's suspicion score on every honest program and verified backdoor.</p>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="lens-intro" id="lens-intro"></div>
  </header>

  <div class="controls">
    <div class="ctl-row toolbar" id="toolbar"></div>
    <div class="ctl-row filterbar" id="filterbar"></div>
  </div>

  <div class="stage">
    <div class="plotwrap">
      <div id="plot"></div>
      <div class="plotcap" id="plotcap"></div>
    </div>
    <aside class="detail" id="detail"></aside>
  </div>

  <div class="featured hidden" id="featured"></div>

  <div class="notes" id="notes"></div>
</div>

<script>/*ECHARTS*/</script>
<script>/*DATA*/</script>
<script>/*LENSES*/</script>
<script>/*APP*/</script>
</body>
</html>
